services:
  business:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ustaw ADMIN_PASSWORD w pliku .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - business-data:/app/data
volumes:
  business-data:
